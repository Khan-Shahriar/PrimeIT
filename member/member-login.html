<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Secure PrimeIt member login">
  <title>PrimeIt — Member Login</title>
  <link rel="stylesheet" href="../css/member-login.css">
</head>
<body>
  <main class="auth">
    <section class="auth-card reveal" aria-labelledby="member-login-title">
      <a class="logo" href="../public/index.html" aria-label="PrimeIt home">
        <span class="logo-mark" aria-hidden="true"><span>P</span></span>
        <span>PrimeIt</span>
      </a>

      <header>
        <h1 id="member-login-title">Member Login</h1>
        <p class="sub">Sign in to your PrimeIt member account.</p>
      </header>

      <form id="member-login-form" data-demo novalidate>
        <div id="login-message" class="login-message" role="status" aria-live="polite" aria-atomic="true"></div>

        <div class="field">
          <label for="member-email">Email</label>
          <input
            id="member-email"
            name="email"
            type="email"
            autocomplete="username"
            inputmode="email"
            required
            placeholder="name@primeit.example"
          >
        </div>

        <div class="field">
          <label for="member-password">Password</label>
          <input
            id="member-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
          >
        </div>

        <div class="login-options">
          <label class="remember-option" for="remember-me">
            <input id="remember-me" name="rememberMe" type="checkbox">
            <span>Remember me</span>
          </label>

          <a href="#" aria-label="Forgot your password?">Forgot password?</a>
        </div>

        <button class="btn btn-primary" type="submit" id="member-login-submit">
          Sign In →
        </button>
      </form>

      <div class="auth-foot">
        Admin?
        <a href="../admin/admin-login.html">Go to Admin Login</a>
      </div>

      <div class="auth-foot">
        <a href="../public/index.html">← Back to website</a>
      </div>
    </section>
  </main>

  <script src="../js/member-login.js"></script>
</body>
</html>
