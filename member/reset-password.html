<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset your PrimeIt member account password">
  <title>PrimeIt — Reset Password</title>
  <link rel="stylesheet" href="../css/member-login.css">
  <link rel="stylesheet" href="../css/member-login-page.css">
  <link rel="stylesheet" href="../css/reset-password.css">
</head>
<body>
  <main class="auth">
    <section class="auth-card reveal" aria-labelledby="reset-password-title">
      <a class="logo" href="../public/index.html" aria-label="PrimeIt home">
        <span class="logo-mark" aria-hidden="true"><span>P</span></span>
        <span>PrimeIt</span>
      </a>

      <header>
        <h1 id="reset-password-title">Reset Password</h1>
        <p class="sub">Create a new password for your PrimeIt member account.</p>
      </header>

      <form id="reset-password-form" novalidate>
        <div id="reset-password-message" class="login-message" role="status" aria-live="polite" aria-atomic="true" hidden></div>

        <div class="field">
          <label for="reset-password">New Password</label>
          <div class="password-field">
            <input
              id="reset-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
              aria-describedby="reset-password-hint"
              placeholder="Enter your new password"
            >
            <button class="password-toggle" type="button" data-password-toggle="reset-password" aria-label="Show new password" aria-pressed="false">Show</button>
          </div>
          <small id="reset-password-hint" class="password-hint">Use 8–128 characters.</small>
        </div>

        <div class="field">
          <label for="reset-password-confirm">Confirm New Password</label>
          <div class="password-field">
            <input
              id="reset-password-confirm"
              name="passwordConfirm"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
              placeholder="Re-enter your new password"
            >
            <button class="password-toggle" type="button" data-password-toggle="reset-password-confirm" aria-label="Show password confirmation" aria-pressed="false">Show</button>
          </div>
        </div>

        <button class="btn btn-primary" type="submit" id="reset-password-submit" disabled>
          Reset Password
        </button>
      </form>

      <div class="auth-foot">
        <a href="member-login.html">← Back to Member Login</a>
      </div>

      <div class="auth-foot">
        <a href="../public/index.html">← Back to website</a>
      </div>
    </section>
  </main><script src="../js/api.js"></script>


  <script src="../js/reset-password.js"></script>
</body>
</html>
