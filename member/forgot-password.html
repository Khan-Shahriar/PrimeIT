<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Recover your PrimeIt member account password">
  <title>PrimeIt — Forgot Password</title>
  <link rel="stylesheet" href="../css/member-login.css">
  <link rel="stylesheet" href="../css/member-login-page.css">
  <link rel="stylesheet" href="../css/forgot-password.css">
</head>
<body>
  <main class="auth">
    <section class="auth-card reveal" aria-labelledby="forgot-password-title">
      <a class="logo" href="../public/index.html" aria-label="PrimeIt home">
        <span class="logo-mark" aria-hidden="true"><span>P</span></span>
        <span>PrimeIt</span>
      </a>

      <header>
        <h1 id="forgot-password-title">Forgot Password?</h1>
        <p class="sub">Enter your account email and we'll send password reset instructions if an account exists.</p>
      </header>

      <form id="forgot-password-form" novalidate>
        <div id="forgot-password-message" class="login-message" role="status" aria-live="polite" aria-atomic="true" hidden></div>

        <div class="field">
          <label for="forgot-email">Email</label>
          <input
            id="forgot-email"
            name="email"
            type="email"
            autocomplete="email"
            inputmode="email"
            maxlength="254"
            required
            placeholder="name@primeit.example"
          >
        </div>

        <button class="btn btn-primary" type="submit" id="forgot-password-submit">
          Send Reset Instructions
        </button>
      </form>

      <div class="auth-foot">
        <a href="member-login.html">← Back to Member Login</a>
      </div>

      <div class="auth-foot">
        <a href="../public/index.html">← Back to website</a>
      </div>
    </section>
  </main><script src="../js/api.js"></script>


  <script src="../js/forgot-password.js"></script>
</body>
</html>
