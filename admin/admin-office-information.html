<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PrimeIt — Office Information</title>
    <link rel="stylesheet" href="../css/admin-office-information.css">
</head>

<body class="app-body">
    <div class="app-shell">
        <aside class="sidebar"><a class="logo" href="admin-dashboard.html"><span
                    class="logo-mark"><span>P</span></span><span class="logo-text">PrimeIt</span></a>
            <div class="side-label"
                style="margin:28px 10px 5px;color:#98A2B3;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em">
                Admin Panel</div>
            <nav class="side-nav"><a class="nav-link " href="admin-dashboard.html">Dashboard</a>
                <a class="nav-link " href="member-management.html">Members</a>
                <a class="nav-link " href="leave-management.html">Leave Management</a>
                <a class="nav-link " href="holiday-management.html">Holidays</a>
                <a class="nav-link " href="admin-announcements.html">Announcements</a>
                <a class="nav-link active" href="admin-office-information.html">Office Information</a>
                <a class="nav-link " href="admin-gallery.html">Gallery</a>
                <a class="nav-link " href="role-permissions.html">Roles & Permissions</a>
                <a class="nav-link " href="admin-profile.html">Admin Profile</a>
            </nav>
            <div class="side-bottom"><a class="nav-link" href="../public/index.html">↩ <span class="side-label">Back to
                        Website</span></a><a class="nav-link" href="admin-login.html">⇥ <span
                        class="side-label">Logout</span></a></div>
        </aside>
        <main class="main">
            <header class="app-topbar"><button class="mobile-toggle">☰</button>
                <div class="search"><input placeholder="Search..." aria-label="Search"></div>
                <div class="user-chip"><span>Administrator</span><span class="user-avatar">AD</span></div>
            </header>
            <section class="content">
                <div class="breadcrumb">Admin Panel / Office Information</div>
                <div class="content-header">
                    <div>
                        <h1 style="font-size:34px;margin:0">Office Information</h1>
                        <p>Manage the information visible to office members.</p>
                    </div>
                </div>
                <div class="card">
                    <form data-office-information-form novalidate>
                        <div class="grid-3">
                            <div class="field"><label for="officeName">Office Name</label><input id="officeName" name="officeName" type="text" placeholder="Office name will be provided by the backend." autocomplete="organization"></div>
                            <div class="field"><label for="officePhone">Phone</label><input id="officePhone" name="phone" type="tel" placeholder="Office phone will be provided by the backend." autocomplete="tel"></div>
                            <div class="field"><label for="officeEmail">Email</label><input id="officeEmail" name="email" type="email" placeholder="Office email will be provided by the backend." autocomplete="email"></div>
                        </div>
                        <div class="field"><label for="officeAddress">Address</label><input id="officeAddress" name="address" type="text" placeholder="Office address will be provided by the backend." autocomplete="street-address"></div>
                        <div class="grid-3">
                            <div class="field"><label for="openingTime">Opening Time</label><input id="openingTime" name="openingTime" type="time"></div>
                            <div class="field"><label for="closingTime">Closing Time</label><input id="closingTime" name="closingTime" type="time"></div>
                            <div class="field"><label for="workingDays">Working Days</label><select id="workingDays" name="workingDays">
                                    <option value="" selected>Not configured</option>
                                </select></div>
                        </div>
                        <div class="field"><label for="officeRules">Office Rules</label><textarea id="officeRules" name="officeRules" placeholder="Office rules will be provided by the backend."></textarea>
                        </div>
                        <div class="field"><label for="emergencyInformation">Emergency Information</label><textarea id="emergencyInformation" name="emergencyInformation" placeholder="Emergency information will be provided by the backend."></textarea></div><button
                            class="btn btn-primary" type="submit">Save Office Information</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/admin-office-information.js"></script>
</body>

</html>
